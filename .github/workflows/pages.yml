name: Publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/config.json', 'public/favicon.svg', 'package*.json', 'index.html', 'vite.config.ts', 'tsconfig.json', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: token-reset-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
