name: Mail invitation service checks
on:
  push:
    paths: ['service/**', '.github/workflows/mail-service.yml']
  pull_request:
    paths: ['service/**', '.github/workflows/mail-service.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test service/tests/*.test.mjs
